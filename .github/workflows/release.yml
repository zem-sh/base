# Builds the server addon (per platform) + the web pane bundle and publishes
# a GitHub Release whose assets are consumed by zem's installers:
#
#   zem addon install <owner>/<repo>          → needs: base-<os>, zem-addon-manifest.toml
#   POST /api/extension/install {"source": …} → needs: pane-manifest.toml, index.js
#
# Asset upload ORDER MATTERS: the server infers the addon name from the FIRST
# release asset (name before the last '-'), so the platform binaries must be
# uploaded first (base-macos → "base"), before the two manifest files
# (zem-addon-manifest.toml → "zem-addon", pane-manifest.toml → "pane").
#
# The terminal font files are uploaded too (flattened to base names). zem's
# current extension installer only fetches a pane's entry/style, so they are
# not consumed yet — see README → "Font assets caveat" / "zem host integration".
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  addon-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build addon
        run: cargo build --release
      - name: Package platform asset
        run: cp target/release/addon base-macos
      - name: Generate addon manifest
        run: ./base-macos --generate-manifest > zem-addon-manifest.toml
      - uses: actions/upload-artifact@v4
        with:
          name: base-macos
          path: base-macos
      - uses: actions/upload-artifact@v4
        with:
          name: addon-manifest
          path: zem-addon-manifest.toml

  addon-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build addon
        run: cargo build --release
      - name: Package platform asset
        run: cp target/release/addon base-linux
      - uses: actions/upload-artifact@v4
        with:
          name: base-linux
          path: base-linux

  pane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build pane bundle
        run: pnpm build
      - name: Collect extension assets
        run: |
          mkdir -p ext-assets
          cp dist/index.js ext-assets/index.js
          cp pane-manifest.toml ext-assets/pane-manifest.toml
          # Fonts: flatten nested dist/assets/*.ttf to base names because
          # GitHub release asset names cannot contain '/'.
          find dist/assets -maxdepth 1 -type f -exec cp {} ext-assets/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: pane-extension
          path: ext-assets/

  release:
    runs-on: ubuntu-latest
    needs: [addon-macos, addon-linux, pane]
    steps:
      # Must run first: checkout cleans the workspace, so it cannot follow
      # download-artifact (it would wipe the downloaded assets). gh needs the
      # git repo to detect which repository the release belongs to.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Sanity check assets
        run: |
          ls -la assets/
          # upload-artifact does not preserve the executable bit; zem's
          # installer chmods the binary after download anyway.
          test -f assets/base-macos
          test -f assets/base-linux
          test -s assets/zem-addon-manifest.toml
          test -s assets/pane-manifest.toml
          test -s assets/index.js
          # At least the JetBrains Mono family must be present.
          test -f assets/JetBrainsMonoNLNerdFontMono-Regular.ttf
      - name: Create release and upload assets in order
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          gh release create "$TAG" --draft --title "$TAG" --generate-notes
          # ORDER MATTERS — platform binaries first (addon name inference),
          # then the addon manifest, then the pane extension files.
          for f in base-macos base-linux zem-addon-manifest.toml pane-manifest.toml index.js; do
            gh release upload "$TAG" "assets/$f"
          done
          # Fonts last (flat assets; see the header note).
          for f in assets/*.ttf; do
            gh release upload "$TAG" "$f"
          done
          gh release edit "$TAG" --draft=false
